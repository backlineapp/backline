function Img({src,initials,accent=ACC,size=44,radius=12}){if(src)return<img src={src} style={{width:size,height:size,borderRadius:radius,objectFit:"cover",flexShrink:0,border:"1px solid "+accent+"55"}}/>;return<div style={{width:size,height:size,borderRadius:radius,flexShrink:0,background:"linear-gradient(145deg,"+accent+"33,"+C.surface2+")",border:"1px solid "+accent+"55",display:"flex",alignItems:"center",justifyContent:"center",color:accent,fontWeight:700,fontSize:size*0.34}}>{initials}</div>;}
function Tag({children,color=ACC}){return<span style={{fontSize:11,fontWeight:600,letterSpacing:"0.04em",textTransform:"uppercase",color,background:color+"1A",border:"1px solid "+color+"33",padding:"3px 8px",borderRadius:6}}>{children}</span>;}
function FollowBtn({following,onClick,accent=ACC}){return<button onClick={onClick} style={{cursor:"pointer",fontSize:13,fontWeight:600,padding:"8px 18px",borderRadius:8,background:following?"transparent":accent,color:following?C.dim:C.bg,border:"1px solid "+(following?C.line:accent)}}>{following?"Siguiendo":"Seguir"}</button>;}
function LinkBtn({label,icon,accent=ACC,filled}){return<div style={{display:"inline-flex",alignItems:"center",gap:7,cursor:"pointer",background:filled?accent:accent+"14",color:filled?C.bg:accent,border:"1px solid "+accent+(filled?"":"44"),borderRadius:10,padding:"9px 14px",fontSize:13,fontWeight:700}}><span>{icon}</span>{label}</div>;}
function ActionBtn({active,onClick,icon,label,activeColor}){const c=!!onClick;return<button onClick={onClick} disabled={!c} style={{cursor:c?"pointer":"default",display:"flex",alignItems:"center",gap:6,background:"transparent",border:"none",color:active?activeColor:C.faint,fontSize:13,fontWeight:600,padding:"4px 10px",borderRadius:8}}><span style={{fontSize:15}}>{icon}</span>{label}</button>;}
function SL({children}){return<div style={{fontSize:12,fontWeight:700,letterSpacing:"0.06em",textTransform:"uppercase",color:C.faint,margin:"22px 0 12px"}}>{children}</div>;}

function Feed({state,tl,ts,onImg,goProfile}){
  const liked=state.likes[1],saved=state.saves[1]!==undefined?state.saves[1]:false;
  const liked2=state.likes[2],saved2=state.saves[2]!==undefined?state.saves[2]:true;
  return(<div>
    <div style={{marginBottom:6}}><h1 style={{fontSize:24,fontWeight:800,color:C.text,margin:0}}>Hola de nuevo</h1><p style={{fontSize:13.5,color:C.faint,margin:"4px 0 0"}}>Lo nuevo de los grupos que sigues.</p></div>
    <div style={{display:"flex",alignItems:"center",gap:8,margin:"18px 0 12px"}}><span style={{width:7,height:7,borderRadius:"50%",background:C.amber,boxShadow:"0 0 8px "+C.amber}}/><span style={{fontSize:12,fontWeight:700,letterSpacing:"0.06em",textTransform:"uppercase",color:C.amber}}>Novedades para ti</span></div>

    <div style={{background:C.surface,border:"1px solid "+ACC+"44",borderRadius:18,overflow:"hidden",boxShadow:"0 0 0 1px "+ACC+"22",marginBottom:14}}>
      <div style={{padding:16,paddingBottom:12}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12,cursor:"pointer"}} onClick={goProfile}>
          <Img src={IMG.perfil} size={40}/><div style={{flex:1}}><div style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontWeight:700,color:C.text,fontSize:14.5}}>El Altar del Holocausto</span><Tag>Novedad</Tag></div><div style={{fontSize:12,color:C.faint,marginTop:2}}>España · 14 may 2026</div></div>
        </div>
        <div style={{fontWeight:700,fontSize:16.5,color:C.text,marginBottom:6}}>Nuevo disco: «ECOS» ya disponible</div>
        <div style={{fontSize:14,color:C.dim,lineHeight:1.55,marginBottom:12}}>Tras un periodo de silencio, ECOS simboliza el regreso de la banda y el inicio de una nueva etapa. Seis piezas grabadas en Metropol Estudios (Madrid). En CD Digipak, vinilo (4 ediciones) y digital.</div>
      </div>
      <div onClick={()=>onImg(IMG.ecos)} style={{cursor:"pointer"}}><img src={IMG.ecos} style={{width:"100%",display:"block"}}/></div>
      <div style={{padding:"12px 16px"}}><LinkBtn label="Escúchalo en Bandcamp" icon={"♪"} accent={ACC} filled/></div>
      <div style={{display:"flex",alignItems:"center",gap:8,borderTop:"1px solid "+C.line,padding:"12px 16px"}}>
        <ActionBtn active={liked} onClick={()=>tl(1)} icon={"♥"} label={(liked?1:0).toString()} activeColor={C.amber}/>
        <ActionBtn active={saved} onClick={()=>ts(1)} icon={"⌾"} label="Guardar" activeColor={ACC}/>
        <ActionBtn icon={"↗"} label="Compartir"/>
      </div>
    </div>

    <div style={{background:C.surface,border:"1px solid "+ACC+"44",borderRadius:18,overflow:"hidden",boxShadow:"0 0 0 1px "+ACC+"22",marginBottom:14}}>

// ====== PANTALLA DE ARRANQUE (SPLASH) ======
function Splash({onEnter}){
  const [fade,setFade]=React.useState(false);
  React.useEffect(()=>{ const t=setTimeout(()=>onEnter(),2600); return ()=>clearTimeout(t); },[]);
  return(
    <div onClick={onEnter} style={{position:"absolute",inset:0,background:"radial-gradient(circle at 50% 40%, #12202b 0%, #05070A 70%)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:"pointer",zIndex:20}}>
      <style>{"@keyframes bpop{0%{transform:scale(0.7);opacity:0}55%{transform:scale(1.06);opacity:1}100%{transform:scale(1);opacity:1}}@keyframes bfade{0%{opacity:0}100%{opacity:1}}@keyframes barsrise{0%{transform:scaleY(0.2);opacity:0.3}100%{transform:scaleY(1);opacity:1}}"}</style>
      <div style={{animation:"bpop 0.9s cubic-bezier(.2,.8,.2,1) both"}}>
        <img src={IMG.logo} style={{height:66}}/>
      </div>
      <div style={{marginTop:18,fontSize:14.5,color:C.dim,fontWeight:500,animation:"bfade 1s ease 0.5s both",letterSpacing:"0.01em"}}>El backstage de tus grupos favoritos</div>

    </div>
  );
}

    {right!==undefined?right:<span style={{color:C.faint,fontSize:16}}>{"›"}</span>}
  </div>);
}
function Toggle({on,onClick}){return<div onClick={onClick} style={{width:44,height:26,borderRadius:14,background:on?ACC:C.surface2,border:"1px solid "+(on?ACC:C.line),position:"relative",cursor:"pointer",transition:"all .15s",flexShrink:0}}><div style={{position:"absolute",top:2,left:on?20:2,width:20,height:20,borderRadius:"50%",background:"#fff",transition:"all .15s"}}/></div>;}
function Ajustes({goBack}){

function App(){
  const [entered,setEntered]=useState(false);const [showSettings,setShowSettings]=useState(false);const [role,setRole]=useState("fan");const [tab,setTab]=useState("feed");const [showProfile,setShowProfile]=useState(false);const [lb,setLb]=useState(null);
  const [state,setState]=useState({likes:{},saves:{},follows:{}});
  const tl=id=>setState(s=>({...s,likes:{...s.likes,[id]:!s.likes[id]}}));
  const ts=id=>setState(s=>{const cur=s.saves[id]!==undefined?s.saves[id]:(id===2);return {...s,saves:{...s.saves,[id]:!cur}};});
  const tf=id=>setState(s=>{const cur=s.follows[id]!==undefined?s.follows[id]:true;return {...s,follows:{...s.follows,[id]:!cur}};});
  const fanTabs=[{id:"feed",label:"Inicio",icon:"⌂"},{id:"grupos",label:"Mis grupos",icon:"⬤"}];
  const openProfile=()=>{setTab("grupos");setShowProfile(true);};
  let screen;
  if(showSettings)screen=<Ajustes goBack={()=>setShowSettings(false)}/>;
  else if(role==="band")screen=<Panel/>;
  else if(tab==="feed")screen=<Feed state={state} tl={tl} ts={ts} onImg={setLb} goProfile={openProfile}/>;
  else if(tab==="grupos" && showProfile)screen=<Perfil state={state} tf={tf} onImg={setLb} goBack={()=>setShowProfile(false)}/>;
  else screen=<Siguiendo goProfile={()=>setShowProfile(true)}/>;
  const roles=[["fan","Cómo lo ve un fan"],["band","Cómo lo veis vosotros"]];
  return(<div style={{minHeight:"100vh",background:"#05070A",display:"flex",flexDirection:"column",alignItems:"center",padding:"20px 16px 40px"}}>
    <div style={{marginBottom:16,display:"flex",flexDirection:"column",alignItems:"center",gap:8}}><span style={{fontSize:11,color:C.faint,letterSpacing:"0.08em",textTransform:"uppercase",fontWeight:600}}>Backline · demo para El Altar del Holocausto</span><div style={{display:"flex",gap:4,background:C.surface,padding:4,borderRadius:12,border:"1px solid "+C.line}}>{roles.map(([k,l])=><button key={k} onClick={()=>{setRole(k);setTab("feed");setShowProfile(false);setShowSettings(false);}} style={{cursor:"pointer",fontSize:12.5,fontWeight:700,padding:"8px 16px",borderRadius:9,border:"none",background:role===k?C.amber:"transparent",color:role===k?C.bg:C.dim}}>{l}</button>)}</div></div>
    <div style={{width:"100%",maxWidth:400,background:C.bg,border:"1px solid "+C.line,borderRadius:28,overflow:"hidden",boxShadow:"0 30px 80px rgba(0,0,0,0.6)",display:"flex",flexDirection:"column",height:780,position:"relative"}}>
      {!entered&&<Splash onEnter={()=>setEntered(true)}/>}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"16px 18px",borderBottom:"1px solid "+C.line,background:"linear-gradient(180deg,"+C.surface+","+C.bg+")"}}><Logo size={24}/><div style={{display:"flex",alignItems:"center",gap:12}}>{role!=="fan"&&<span style={{fontSize:11,fontWeight:700,color:ACC,textTransform:"uppercase",letterSpacing:"0.05em"}}>Panel de grupo</span>}<button onClick={()=>setShowSettings(true)} style={{cursor:"pointer",width:34,height:34,borderRadius:9,background:C.surface,border:"1px solid "+C.line,color:showSettings?C.amber:C.dim,fontSize:16,display:"flex",alignItems:"center",justifyContent:"center"}}>{"⚙"}</button></div></div>
      <div style={{flex:1,overflowY:"auto",padding:"20px 16px "+(role==="fan"?"90px":"20px")}}>{screen}</div>
      {role==="fan"&&!showSettings&&<div style={{position:"absolute",bottom:0,left:0,right:0,display:"flex",borderTop:"1px solid "+C.line,background:C.surface}}>{fanTabs.map(t=>{const a=tab===t.id;return<button key={t.id} onClick={()=>{setTab(t.id);if(t.id!=="grupos")setShowProfile(false);}} style={{flex:1,cursor:"pointer",background:"transparent",border:"none",padding:"12px 0 16px",display:"flex",flexDirection:"column",alignItems:"center",gap:4,color:a?C.amber:C.faint}}><span style={{fontSize:18}}>{t.icon}</span><span style={{fontSize:11,fontWeight:600}}>{t.label}</span></button>;})}</div>}
    </div>
    <div style={{marginTop:14,fontSize:12,color:C.faint,textAlign:"center",maxWidth:400,lineHeight:1.5}}>Toda la info de El Altar del Holocausto es real, de su Bandcamp. Cambia arriba entre la vista del fan y la vuestra.</div>
    {lb&&<div onClick={()=>setLb(null)} style={{position:"fixed",inset:0,background:"rgba(5,7,10,0.94)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:50,padding:24,cursor:"zoom-out"}}><img src={lb} style={{maxWidth:"100%",maxHeight:"100%",borderRadius:12}}/></div>}
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
