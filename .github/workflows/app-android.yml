# Compila la app de Android de Backline (versión de prueba) en los ordenadores
# de GitHub, sin instalar nada en el Mac. Se lanza sola al fusionar cambios en
# la web o en la carpeta app, o a mano desde la pestaña «Actions».
# El resultado (Backline-prueba.apk) se descarga desde la ejecución, en «Artifacts».
name: App Android (prueba)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/app-android.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.js'
      - '*.html'
      - 'estilos.css'
      - '.github/workflows/app-android.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Preparar la app
        working-directory: app
        run: |
          npm ci
          npm run copiar
          npx cap sync android
      - name: Compilar
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Guardar el APK
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk Backline-prueba.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Backline-prueba-android
          path: Backline-prueba.apk
          retention-days: 30
