name: App Android (prueba de calendario y mapas)

# Prueba automática en un móvil Android simulado: abre un concierto y pulsa
# «Cómo llegar» y «Añadir al calendario», y guarda capturas y el registro de
# qué app se abre. Solo se ejecuta cuando cambia este archivo (prueba 3).
on:
  pull_request:
    paths:
      - '.github/workflows/app-android-enlaces.yml'

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Compilar APK de prueba
        run: |
          cd app && npm ci && npm run copiar && npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Probar en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          disable-animations: true
          script: bash .github/prueba-enlaces.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prueba-enlaces
          path: prueba/
